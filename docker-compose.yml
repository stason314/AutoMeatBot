services:
  api:
    build:
      context: .
      dockerfile: src/AutoMeatBot.Api/Dockerfile
    ports:
      - "${HOST_BIND_IP:-0.0.0.0}:${HOST_HTTP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: automeatbot
      POSTGRES_USER: automeatbot
      POSTGRES_PASSWORD: automeatbot
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
